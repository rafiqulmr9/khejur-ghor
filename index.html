// ===== STATE =====
let L=0,cat='all',page=1,cur=null,cart=[],zone='d',gift=false;
try{cart=JSON.parse(localStorage.getItem('kg_cart')||'[]');zone=localStorage.getItem('kg_zone')||'d';L=+localStorage.getItem('kg_lang')||0}catch(e){}
const t=k=>T[k][L],pn=p=>L?p.en:p.bn,$=id=>document.getElementById(id);
const fmt=n=>'৳'+n.toLocaleString(L?'en-US':'bn-BD');
const save=()=>{try{localStorage.setItem('kg_cart',JSON.stringify(cart));localStorage.setItem('kg_zone',zone)}catch(e){}};
const ph=(p,src,n)=>`<div class="ph" data-img="${src}"><div><b>${(p.en[0])}</b><small>${src}</small></div></div>`;
function hydrate(root){root.querySelectorAll('[data-img]:not([data-done])').forEach(el=>{el.dataset.done=1;const s=el.dataset.img;if(!el.children.length)el.innerHTML='<div><b>🌴</b><small>'+s+'</small></div>';const im=new Image();im.alt='';im.onload=()=>el.appendChild(im);im.src=s})}

// ===== RENDER =====
function applyLang(){document.documentElement.lang=L?'en':'bn';$('lang').textContent=L?'বাং':'EN';
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
const sel=(id,arr)=>{const el=$(id),v=el.value;el.innerHTML=arr.map(a=>`<option value="${a[0]}">${a[1]}</option>`).join('');el.value=v||arr[0][0]};
sel('fp',[['',t('fpA')],['1',t('fp1')],['2',t('fp2')],['3',t('fp3')],['4',t('fp4')]]);
sel('fw',[['',t('fwA')],...['250g','500g','1kg','200g','400g'].map(w=>[w,w])]);
sel('so',[['0',t('s0')],['1',t('s1')],['2',t('s2')],['3',t('s3')]]);
$('tabs').innerHTML=[['all','all'],['d','dates'],['p','made']].map(a=>`<button class="tab ${cat==a[0]?'on':''}" onclick="goCat('${a[0]}')">${t(a[1])}</button>`).join('');
$('ben').innerHTML=BEN.map(w=>`<div><h3>${w[L]}</h3><p>${w[2+L]}</p></div>`).join('');
$('why').innerHTML=WHY.map(w=>`<div><h3>${w[L]}</h3><p>${w[2+L]}</p></div>`).join('');
$('inf').innerHTML=INF.map(w=>`<div><h3>${w[L]}</h3><p>${w[2+L]}</p></div>`).join('');
$('rev').innerHTML=REV.map(w=>`<blockquote><span class="stars">★★★★★</span><p>${w[L]}</p><cite>${w[2+L]}</cite></blockquote>`).join('');
$('faqs').innerHTML=FAQ.map(f=>`<details><summary>${f[L]}</summary><p>${f[2+L]}</p></details>`).join('');
$('deltb').innerHTML=`<tr><td>${t('zd')}</td><td>${fmt(CFG.dhaka)}</td><td>${CFG.eta[L*2]}</td></tr><tr><td>${t('zo')}</td><td>${fmt(CFG.outside)}</td><td>${CFG.eta[L*2+1]}</td></tr>`;
$('sp').innerHTML=SPECIAL.map(s=>`<div class="sp"><div class="ph spimg" data-img="public/images/special/${s[3]}.jpg">${DSVG}</div><h3>${s[L]}</h3><div class="pr">${fmt(s[2])} <small style="font-weight:400">(${L?'demo':'ডেমো'})</small></div><a class="btn alt" target="_blank" rel="noopener" href="${wa(s[L]+' — '+fmt(s[2]))}">${t('spo')}</a></div>`).join('');
$('wa').href=wa('');$('fcw').href=wa('');$('fb').href=CFG.fb||'#';$('fb').title=CFG.fb?'':'Add your Facebook page link in CFG.fb';
$('featured').innerHTML=P.filter(p=>p.feat).map(card).join('');
renderAll();renderCart();hydrate(document.body)}
const wa=m=>`https://wa.me/${CFG.wa}?text=${encodeURIComponent('খেজুরঘর: '+m)}`;
function card(p){const wi=0,pr=price(p,wi),sp=sale(p,wi);return`<article class="card">${p.disc?`<span class="tag">-${p.disc}%</span>`:''}<div class="ph" data-img="${p.img}" onclick="openP('${p.id}')"></div><div class="bd"><h3 onclick="openP('${p.id}')">${pn(p)}</h3><div class="en">${L?p.bn:p.en} · ${p.w[wi][L]}</div><div class="pr">${p.disc?fmt(sp)+'<s>'+fmt(pr)+'</s>':fmt(pr)}</div><div class="st ${p.stock}">${t(p.stock)}</div><div class="row"><button class="btn alt" ${p.stock=='out'?'disabled':''} onclick="addC('${p.id}',0,1)">${t('add')}</button></div></div></article>`}
function renderAll(){const q=$('q').value.trim().toLowerCase(),fp=$('fp').value,fw=$('fw').value,so=$('so').value;
let r=P.filter(p=>(cat=='all'||p.cat==cat)&&(!q||(p.bn+p.en).toLowerCase().includes(q))&&(!fw||p.w.some(w=>w[1]==fw))&&(!fp||inR(sale(p,0),+fp)));
if(so=='1')r.sort((a,b)=>sale(a,0)-sale(b,0));if(so=='2')r.sort((a,b)=>sale(b,0)-sale(a,0));if(so=='3')r.sort((a,b)=>a.en.localeCompare(b.en));
const n=page*12;$('grid').innerHTML=r.slice(0,n).map(card).join('')||`<p>—</p>`;
$('count').textContent=(L?`Showing ${Math.min(n,r.length)} of ${r.length} products`:`${r.length}টি পণ্যের মধ্যে ${Math.min(n,r.length).toLocaleString('bn-BD')}টি দেখানো হচ্ছে`);
$('more').style.display=n<r.length?'':'none';hydrate($('grid'));
$('tabs').querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on',['all','d','p'][i]==cat))}
const inR=(v,k)=>[[0,1e9],[0,500],[500,1000],[1000,2000],[2000,1e9]][k].reduce((a,b)=>v>=a&&v<=b?true:false);
function orderNow(){if(cart.length)openCart();else{goCat('all');$('products').scrollIntoView({behavior:'smooth'})}}
function goCat(c){cat=c;page=1;renderAll();document.getElementById('nav').classList.remove('on')}
function setLang(){L=1-L;try{localStorage.setItem('kg_lang',L)}catch(e){}applyLang();if(cur&&$('modal').classList.contains('on'))openP(cur.p.id,cur.wi,cur.q)}

// ===== PRODUCT MODAL =====
function openP(id,wi=0,q=1){const p=P.find(x=>x.id==id);cur={p,wi,q};closeAll(true);
const g=[p.img,p.img.replace('.jpg','-2.jpg'),p.img.replace('.jpg','-3.jpg')];
const pr=price(p,wi),sp=sale(p,wi);
$('mc').innerHTML=`<div class="pd"><div><div class="ph main" id="gm" data-img="${g[0]}"></div><div class="th">${g.map((s,i)=>`<div class="ph ${i?'':'on'}" data-img="${s}" onclick="gal(this,'${s}')"></div>`).join('')}</div></div>
<div><small>${p.id} · ${t(p.cat=='d'?'dates':'made')}</small><h2>${pn(p)}</h2><div class="en">${L?p.bn:p.en}</div>
<div class="pr" style="font-size:1.5rem;margin:8px 0">${p.disc?fmt(sp)+'<s>'+fmt(pr)+'</s>':fmt(pr)} <small style="font-weight:400;font-size:.75rem">(${L?'demo':'ডেমো'})</small></div>
<div class="st ${p.stock}">${t(p.stock)}</div>
<b>${t('wt')}</b><div class="wo">${p.w.map((w,i)=>`<button class="${i==wi?'on':''}" onclick="openP('${p.id}',${i},cur.q)">${w[L]}</button>`).join('')}</div>
<b>${t('qty')}</b><div class="q"><button onclick="cur.q=Math.max(1,cur.q-1);$('mq').textContent=cur.q">−</button><span id="mq">${q}</span><button onclick="cur.q++;$('mq').textContent=cur.q">+</button></div>
<div class="info"><p><b>${t('dsc')}:</b> ${L?'Selected product from the KhejurGhor range. (Edit this description.)':'খেজুরঘরের বাছাইকৃত পণ্য। (এই বিবরণ এডিট করুন।)'}</p><p><b>${t('orig')}:</b> ${t('tbc')}</p><p><b>${t('taste')}:</b> ${t('tbc')}</p><p><b>${t('stor')}:</b> ${t('stt')}</p></div>
<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" ${p.stock=='out'?'disabled':''} onclick="addC('${p.id}',cur.wi,cur.q)">${t('add')}</button><button class="btn alt" ${p.stock=='out'?'disabled':''} onclick="addC('${p.id}',cur.wi,cur.q,1)">${t('bnow')}</button></div></div></div>
<h3 style="margin:26px 0 12px">${t('rel')}</h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${P.filter(x=>x.cat==p.cat&&x.id!=p.id).slice(0,4).map(x=>`<div class="card" onclick="openP('${x.id}')" style="cursor:pointer"><div class="ph" data-img="${x.img}" style="aspect-ratio:1"></div><div class="bd"><h3 style="font-size:.9rem">${pn(x)}</h3></div></div>`).join('')}</div>`;
$('modal').classList.add('on');hydrate($('mc'))}
function gal(el,s){document.querySelectorAll('.th .ph').forEach(e=>e.classList.remove('on'));el.classList.add('on');const m=$('gm');m.innerHTML='<div><b>🌴</b><small>'+s+'</small></div>';m.dataset.done=1;const im=new Image();im.onload=()=>m.appendChild(im);im.src=s}

// ===== CART =====
function addC(id,wi,q,buy){const k=cart.find(c=>c.id==id&&c.wi==wi);k?k.q+=q:cart.push({id,wi,q});save();renderCart();buy?(closeAll(),openCart(),setTimeout(checkout,50)):(closeAll(true),openCart())}
function chg(i,d){cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);save();renderCart()}
function del(i){cart.splice(i,1);save();renderCart()}
function totals(){let list=0,sub=0;cart.forEach(c=>{const p=P.find(x=>x.id==c.id);list+=price(p,c.wi)*c.q;sub+=sale(p,c.wi)*c.q});const dc=!cart.length?0:sub>=CFG.freeOver?0:zone=='d'?CFG.dhaka:CFG.outside;const gf=gift&&cart.length?CFG.giftFee:0;return{list,sub,dis:list-sub,dc,gf,tot:sub+dc+gf}}
function renderCart(){const cn=cart.reduce((a,c)=>a+c.q,0);$('cc').textContent=cn;$('obc').textContent=cn?'('+cn.toLocaleString(L?'en-US':'bn-BD')+')':'';
$('ci').innerHTML=cart.length?cart.map((c,i)=>{const p=P.find(x=>x.id==c.id);return`<div class="ci"><div class="ph" data-img="${p.img}"></div><div><b>${pn(p)}</b><div>${p.w[c.wi][L]} · ${fmt(sale(p,c.wi))}</div><div class="q"><button onclick="chg(${i},-1)" aria-label="-">−</button><span>${c.q}</span><button onclick="chg(${i},1)" aria-label="+">+</button></div></div><div style="text-align:right"><b>${fmt(sale(p,c.wi)*c.q)}</b><br><button class="x" onclick="del(${i})">${t('rm')}</button></div></div>`}).join(''):`<p style="padding:20px 0">${t('empty')}</p>`;
const x=totals();
$('cf').innerHTML=`<label>${t('zsel')}<select onchange="zone=this.value;save();renderCart()"><option value="d" ${zone=='d'?'selected':''}>${t('zd')} (${fmt(CFG.dhaka)})</option><option value="o" ${zone=='o'?'selected':''}>${t('zo')} (${fmt(CFG.outside)})</option></select></label>
<label style="display:flex;gap:8px;margin:4px 0 8px"><input type="checkbox" ${gift?'checked':''} onchange="gift=this.checked;renderCart()"> ${t('gopt')} (+${fmt(CFG.giftFee)})</label>
<div class="l"><span>${t('sub')}</span><span>${fmt(x.list)}</span></div><div class="l"><span>${t('dis')}</span><span>−${fmt(x.dis)}</span></div><div class="l"><span>${t('dc')}</span><span>${x.dc?fmt(x.dc):t('free')}</span></div>${x.gf?`<div class="l"><span>${t('gf')}</span><span>${fmt(x.gf)}</span></div>`:''}<div class="l t"><span>${t('tot')}</span><span>${fmt(x.tot)}</span></div>
<button class="btn" style="width:100%;margin-top:10px" ${cart.length?'':'disabled'} onclick="checkout()">${t('chk')}</button>`;hydrate($('ci'))}
function openCart(){$('ov').classList.add('on');$('drawer').classList.add('on')}
function closeAll(keep){$('drawer').classList.remove('on');$('modal').classList.remove('on');if(!keep)$('ov').classList.remove('on');else $('ov').classList.add('on')}
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeAll()});

// ===== CHECKOUT =====
function checkout(){if(!cart.length)return;const x=totals();$('drawer').classList.remove('on');$('ov').classList.add('on');
$('mc').innerHTML=`<h2>${t('chk')}</h2><div class="pd"><form class="f" id="cf2" novalidate onsubmit="place(event)">
<label>${t('name')}<input id="fn"><span class="er" id="e1"></span></label><label>${t('mob')}<input id="fm" inputmode="numeric" placeholder="01XXXXXXXXX"><span class="er" id="e2"></span></label>
<label>${t('adr')}<textarea id="fa" rows="2"></textarea><span class="er" id="e3"></span></label><label>${t('dist')}<input id="fd2" list="dl"><span class="er" id="e4"></span></label>
<datalist id="dl"><option>Dhaka</option><option>Chattogram</option><option>Sylhet</option><option>Rajshahi</option><option>Khulna</option><option>Barishal</option><option>Rangpur</option><option>Mymensingh</option><option>Gazipur</option><option>Narayanganj</option></datalist>
<label>${t('pay')}<select><option>${t('codl')}</option></select></label><button class="btn">${t('place')}</button></form>
<div class="info" style="margin:0;align-self:start">${cart.map(c=>{const p=P.find(y=>y.id==c.id);return`<p>${pn(p)} (${p.w[c.wi][L]}) × ${c.q} — ${fmt(sale(p,c.wi)*c.q)}</p>`}).join('')}<hr style="margin:8px 0;border:0;border-top:1px dashed #cdb894"><p>${t('sub')}: ${fmt(x.sub)}</p><p>${t('dc')}: ${x.dc?fmt(x.dc):t('free')}</p>${x.gf?`<p>${t('gf')}: ${fmt(x.gf)}</p>`:''}<p><b>${t('tot')}: ${fmt(x.tot)}</b></p></div></div>`;$('modal').classList.add('on')}
function place(e){e.preventDefault();const v=id=>$(id).value.trim();let ok=true;
const chk=(c,er,k)=>{$(er).textContent=c?'':t(k);if(!c)ok=false};
chk(v('fn').length>1,'e1','e1');chk(/^(\+?88)?01[3-9]\d{8}$/.test(v('fm')),'e2','e2');chk(v('fa').length>=10,'e3','e3');chk(v('fd2').length>1,'e4','e4');if(!ok)return;
zone=/dhaka|ঢাকা/i.test(v('fd2'))?'d':'o';const x=totals(),id='KG'+Date.now().toString().slice(-6);
$('mc').innerHTML=`<div class="ok"><h2>${t('okH')}</h2><p><b>${id}</b></p><p style="margin:8px 0">${t('okP')}</p><p><b>${t('tot')}: ${fmt(x.tot)}</b></p><a class="btn" style="display:inline-block;margin-top:14px" target="_blank" rel="noopener" href="${wa(id+' · '+v('fn')+' · '+v('fm')+' · '+fmt(x.tot))}">${t('wam')}</a></div>`;
cart=[];gift=false;save();renderCart()}
applyLang();
(function(){const hd=document.querySelector('header');addEventListener('scroll',()=>hd.classList.toggle('sc',scrollY>8),{passive:true});
const hero=document.querySelector('.hero');hero.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect();hero.style.setProperty('--mx',(e.clientX-r.left)+'px');hero.style.setProperty('--my',(e.clientY-r.top)+'px')});
if(!('IntersectionObserver' in window))return;
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.3});
document.querySelectorAll('section h2').forEach(h=>{h.classList.add('pop');io.observe(h)})})();
</script>
</body>
</html>
