<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KhejurGhor Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--brown:#442817;--caramel:#A66C32;--gold:#D6B47A;--cream:#F5EBDD;--paper:#fffdf8;--ink:#29221c;--muted:#887968;--line:#eee5d8;--green:#287a52;--red:#b54b43;--shadow:0 8px 28px rgba(68,40,23,.07)}
*{box-sizing:border-box}body{margin:0;background:#f8f6f2;color:var(--ink);font:14px Inter,'Hind Siliguri',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.layout{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:252px;background:var(--brown);color:#f9f1e5;padding:24px 16px;z-index:5;display:flex;flex-direction:column}.brand{font:700 22px 'Hind Siliguri';padding:4px 12px 30px;color:#f8e8cc}.brand small{display:block;font:11px Inter;letter-spacing:2px;color:var(--gold);margin-top:2px}.navlabel{font-size:10px;letter-spacing:1.6px;color:#bfa98d;padding:8px 12px}.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:0;background:transparent;color:#e9ddcd;border-radius:10px;text-align:left;margin:2px 0}.nav button.active,.nav button:hover{background:#65452f;color:white}.nav .ico{width:20px;text-align:center}.sidefoot{margin-top:auto;padding:12px;color:#c8b69f;font-size:11px}.main{margin-left:252px;padding:28px 34px;max-width:1700px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.top h1{font-size:25px;margin:0;color:var(--brown)}.top p{margin:5px 0 0;color:var(--muted)}.topright{display:flex;gap:10px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;background:var(--cream);display:grid;place-items:center;color:var(--brown);font-weight:800}.btn{border:0;border-radius:9px;background:var(--brown);color:white;padding:10px 15px;font-weight:600}.btn:hover{background:var(--caramel)}.btn.light{background:#f3eadc;color:var(--brown)}.btn.danger{background:#fff0ed;color:var(--red)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:19px}.stathead{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.staticon{width:34px;height:34px;border-radius:10px;background:var(--cream);display:grid;place-items:center;color:var(--brown);font-size:17px}.stat strong{display:block;font-size:26px;margin:12px 0 3px;color:var(--brown)}.stat small{color:var(--muted)}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:18px}.panel{padding:20px;margin-bottom:18px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}.panel h2{font-size:16px;margin:0;color:var(--brown)}.panel p.sub{color:var(--muted);margin:4px 0 0;font-size:12px}.chartbox{height:260px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:680px}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);background:#fdfbf8}td{font-size:13px}tbody tr:hover{background:#fffdf9}.pill{display:inline-block;border-radius:30px;padding:5px 9px;font-size:11px;font-weight:700;background:#f5ead8;color:#8b5a22}.pill.delivered{background:#e7f5ed;color:#287a52}.pill.cancelled{background:#ffefed;color:#b54b43}.pill.processing,.pill.shipped{background:#edf2ff;color:#425e9a}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select,.field input,.field select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;min-width:150px}.toolbar input{flex:1}.empty{text-align:center;color:var(--muted);padding:36px}.actions{display:flex;gap:6px}.small{padding:7px 9px;font-size:11px}.productname{font-weight:700;color:var(--brown)}.low{color:#b36b20;font-weight:700}.out{color:var(--red);font-weight:700}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted)}.field input,.field select{width:100%}.modal{position:fixed;inset:0;background:#24170fc0;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modalbox{background:white;border-radius:16px;padding:24px;width:min(600px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0;color:var(--brown)}.close{border:0;background:#f4eee5;border-radius:8px;padding:7px 11px}.notice{padding:12px 14px;border-radius:10px;background:#fff7e8;color:#7b5424;margin-bottom:16px;font-size:12px}.mobilemenu{display:none}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:760px){.side{transform:translateX(-100%);transition:.25s}.side.open{transform:none}.main{margin:0;padding:18px 14px}.mobilemenu{display:inline-block}.top h1{font-size:21px}.cards{gap:10px}.stat{padding:14px}.stat strong{font-size:21px}.formgrid{grid-template-columns:1fr}.topright .adminlabel{display:none}}
</style></head>
<body>
<div class="layout">
<aside class="side" id="sidebar"><div class="brand">খেজুরঘর<small>KHEJURGHOR ADMIN</small></div>
<div class="navlabel">STORE MANAGEMENT</div><nav class="nav">
<button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
<button data-page="orders"><span class="ico">▤</span>Orders</button>
<button data-page="products"><span class="ico">◇</span>Products</button>
<button data-page="customers"><span class="ico">♙</span>Customers</button>
<button data-page="inventory"><span class="ico">▣</span>Inventory</button>
<button data-page="reports"><span class="ico">▥</span>Reports</button>
<button data-page="settings"><span class="ico">⚙</span>Settings</button>
</nav><div class="sidefoot">Demo admin · Local browser data<br><a href="index.html" style="color:#e8c98e">← View Store</a></div></aside>
<main class="main">
<header class="top"><div style="display:flex;gap:12px;align-items:center"><button class="btn light mobilemenu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div><h1 id="pageTitle">Dashboard Overview</h1><p id="today"></p></div></div><div class="topright"><button class="btn light" onclick="exportCSV()">↓ Export CSV</button><div class="avatar">KG</div><span class="adminlabel">Admin</span></div></header>
<div class="notice">Demo mode: data is saved in this browser only. For real multi-device orders, connect a backend such as Supabase or Firebase.</div>
<section id="content"></section>
</main></div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Details</h2><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
const $=s=>document.querySelector(s), money=n=>'৳'+Number(n||0).toLocaleString('en-BD');
const get=(k,d=[])=>{try{const x=JSON.parse(localStorage.getItem(k));return x??d}catch{return d}};
const set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let orders=get('kg_orders'), products=get('kg_products'), customers=get('kg_customers');
const baseProducts=[
['KG-001','আজওয়া খেজুর','Ajwa Dates',900,20],['KG-002','মেডজুল খেজুর','Medjool Dates',850,18],['KG-003','সুক্কারি খেজুর','Sukkari Dates',650,25],['KG-004','মাবরুম খেজুর','Mabroom Dates',700,8],['KG-005','সাফাউই খেজুর','Safawi Dates',600,12],['KG-006','কালমি খেজুর','Kalmi Dates',550,15],['KG-007','খুদরি খেজুর','Khudri Dates',500,0],['KG-008','ডেগলেট নুর খেজুর','Deglet Noor Dates',450,10],['KG-009','বারহি খেজুর','Barhi Dates',600,22],['KG-010','জাহিদি খেজুর','Zahidi Dates',400,14],['KG-011','হালাউই খেজুর','Halawy Dates',480,11],['KG-012','খোলাস খেজুর','Kholas Dates',520,17],['KG-013','আনবারা খেজুর','Anbara Dates',950,9],['KG-014','মাজাফাতি খেজুর','Mazafati Dates',500,16],['KG-015','পিয়ারম খেজুর','Piarom Dates',800,13],['KG-016','কাবকাব খেজুর','Kabkab Dates',480,7],['KG-017','দাইরি খেজুর','Dayri Dates',470,16],['KG-018','থুরি খেজুর','Thoory Dates',520,19],['KG-019','ফার্ড খেজুর','Fard Dates',450,21],['KG-020','লুলু খেজুর','Lulu Dates',490,12],['KG-021','খেজুরের সিরাপ','Date Syrup',450,20],['KG-022','খেজুরের মোলাসেস','Date Molasses',400,15],['KG-023','খেজুরের পেস্ট','Date Paste',350,14],['KG-024','খেজুরের চিনি','Date Sugar',420,9],['KG-025','খেজুরের জ্যাম','Date Jam',380,13],['KG-026','চকলেট কভারড খেজুর','Chocolate Covered Dates',600,12],['KG-027','স্টাফড খেজুর','Stuffed Dates',650,10],['KG-028','ডেটস এনার্জি বল','Date Energy Balls',480,8],['KG-029','ডেটস কুকিজ','Date Cookies',350,18],['KG-030','প্রিমিয়াম ডেটস গিফট বক্স','Premium Dates Gift Box',1500,6]];
if(!products.length){products=baseProducts.map(p=>({id:p[0],bn:p[1],en:p[2],base:p[3],price:p[3],stock:p[4],disc:0,active:true}));set('kg_products',products)}
let page='dashboard',chart;
function sync(){orders=get('kg_orders');products=get('kg_products');customers=get('kg_customers')}
function status(s){return `<span class="pill ${String(s).toLowerCase()}">${s||'Pending'}</span>`}
function pageTitle(p){return ({dashboard:'Dashboard Overview',orders:'Order Management',products:'Product Management',customers:'Customer Management',inventory:'Inventory & Stock',reports:'Sales Reports',settings:'Store Settings'})[p]}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#pageTitle').textContent=pageTitle(p);render();$('#sidebar').classList.remove('open')}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
$('#today').textContent=new Date().toLocaleDateString('en-BD',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
function render(){sync();({dashboard:dashboard,orders:ordersPage,products:productsPage,customers:customersPage,inventory:inventoryPage,reports:reportsPage,settings:settingsPage})[page]()}
function dashboard(){
let revenue=orders.filter(o=>o.status!=='Cancelled').reduce((a,o)=>a+Number(o.total||0),0),pending=orders.filter(o=>(o.status||'Pending')==='Pending').length,low=products.filter(p=>Number(p.stock)<=5).length;
$('#content').innerHTML=`<div class="cards">
${stat('Total Revenue',money(revenue),'৳','All non-cancelled orders')}${stat('Total Orders',orders.length,'▤','Orders received')}${stat('Customers',customers.length,'♙','Unique phone numbers')}${stat('Pending Orders',pending,'◷',low+' low-stock products')}
</div><div class="grid2"><div class="panel"><div class="panelhead"><div><h2>Revenue Overview</h2><p class="sub">Revenue by recent orders</p></div></div><div class="chartbox"><canvas id="salesChart"></canvas></div></div><div class="panel"><div class="panelhead"><div><h2>Order Status</h2><p class="sub">Current order distribution</p></div></div><div class="chartbox"><canvas id="statusChart"></canvas></div></div></div>
<div class="panel"><div class="panelhead"><h2>Recent Orders</h2><button class="btn light small" onclick="go('orders')">View all</button></div>${orderTable(orders.slice(0,6))}</div>`;
drawCharts();
}
function stat(label,value,ico,sub){return `<div class="stat"><div class="stathead"><span>${label}</span><span class="staticon">${ico}</span></div><strong>${value}</strong><small>${sub}</small></div>`}
function drawCharts(){if(chart)chart.forEach(c=>c.destroy());chart=[];let last=orders.slice(0,7).reverse();let a=new Chart($('#salesChart'),{type:'line',data:{labels:last.map(o=>new Date(o.createdAt).toLocaleDateString()),datasets:[{label:'Sales',data:last.map(o=>o.status==='Cancelled'?0:Number(o.total||0)),borderColor:'#A66C32',backgroundColor:'rgba(166,108,50,.12)',fill:true,tension:.35}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});let counts=['Pending','Processing','Shipped','Delivered','Cancelled'].map(s=>orders.filter(o=>o.status===s).length);let b=new Chart($('#statusChart'),{type:'doughnut',data:{labels:['Pending','Processing','Shipped','Delivered','Cancelled'],datasets:[{data:counts,backgroundColor:['#D6B47A','#6f88b8','#89a8d5','#65a77e','#d77c70']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});chart=[a,b]}
function orderTable(list){if(!list.length)return '<div class="empty">No orders yet. Place a test order from the store.</div>';return `<div class="tablewrap"><table><thead><tr><th>Order ID</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody>${list.map(o=>`<tr><td><b>${esc(o.id)}</b></td><td>${esc(o.customer)}<br><small>${esc(o.phone)}</small></td><td>${new Date(o.createdAt).toLocaleDateString()}</td><td>${money(o.total)}</td><td>${status(o.status)}</td><td><button class="btn light small" onclick="viewOrder('${o.id}')">View</button></td></tr>`).join('')}</tbody></table></div>`}
function ordersPage(){$('#content').innerHTML=`<div class="panel"><div class="toolbar"><input id="osearch" placeholder="Search order, customer or phone..." oninput="filterOrders()"><select id="ostatus" onchange="filterOrders()"><option value="">All statuses</option>${['Pending','Processing','Shipped','Delivered','Cancelled'].map(s=>`<option>${s}</option>`).join('')}</select></div><div id="orderRows">${orderTable(orders)}</div></div>`}
function filterOrders(){let q=$('#osearch').value.toLowerCase(),s=$('#ostatus').value;let list=orders.filter(o=>(!s||o.status===s)&&[o.id,o.customer,o.phone].join(' ').toLowerCase().includes(q));$('#orderRows').innerHTML=orderTable(list)}
function viewOrder(id){let o=orders.find(x=>x.id===id);if(!o)return;$('#modalTitle').textContent='Order '+o.id;$('#modalBody').innerHTML=`<p><b>${esc(o.customer)}</b> · ${esc(o.phone)}</p><p>${esc(o.address)}, ${esc(o.district)}</p><p style="margin:10px 0">Payment: ${esc(o.payment||'Cash on Delivery')}</p><div class="tablewrap"><table><tr><th>Product</th><th>Qty</th><th>Price</th></tr>${(o.items||[]).map(i=>`<tr><td>${esc(i.nameBn||i.nameEn)} (${esc(i.weight||'')})</td><td>${i.quantity}</td><td>${money(i.lineTotal)}</td></tr>`).join('')}</table></div><p style="margin:12px 0"><b>Total: ${money(o.total)}</b></p><div class="toolbar"><select id="newStatus">${['Pending','Processing','Shipped','Delivered','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn" onclick="updateStatus('${o.id}')">Save status</button><button class="btn light" onclick="printOrder('${o.id}')">Print invoice</button><button class="btn danger" onclick="deleteOrder('${o.id}')">Delete</button></div>`;$('#modal').classList.add('show')}
function updateStatus(id){let o=orders.find(x=>x.id===id);o.status=$('#newStatus').value;set('kg_orders',orders);closeModal();render()}
function deleteOrder(id){if(!confirm('Delete this demo order?'))return;set('kg_orders',orders.filter(o=>o.id!==id));closeModal();render()}
function printOrder(id){let o=orders.find(x=>x.id===id),w=window.open('','_blank');w.document.write(`<h1>KhejurGhor Invoice</h1><p>${o.id} · ${o.customer} · ${o.phone}</p><p>${o.address}, ${o.district}</p><table border="1" cellpadding="8"><tr><th>Product</th><th>Qty</th><th>Amount</th></tr>${o.items.map(i=>`<tr><td>${i.nameBn} ${i.weight||''}</td><td>${i.quantity}</td><td>${money(i.lineTotal)}</td></tr>`).join('')}</table><h3>Total: ${money(o.total)}</h3>`);w.document.close();w.print()}
function productsPage(){let q=$('#psearch')?.value.toLowerCase()||'';let list=products.filter(p=>[p.bn,p.en,p.id].join(' ').toLowerCase().includes(q));$('#content').innerHTML=`<div class="panel"><div class="panelhead"><h2>Store Products (${products.length})</h2><button class="btn" onclick="productForm()">+ Add Product</button></div><div class="toolbar"><input id="psearch" placeholder="Search products..." value="${esc(q)}" oninput="productsPage()"></div><div class="tablewrap"><table><thead><tr><th>Product</th><th>Price</th><th>Discount %</th><th>Stock</th><th>Status</th><th>Action</th></tr></thead><tbody>${list.map(p=>`<tr><td><span class="productname">${esc(p.bn||p.en)}</span><br><small>${esc(p.id)} · ${esc(p.en||'')}</small></td><td>${money(p.price??p.base)}</td><td>${p.disc||0}%</td><td>${p.stock}</td><td>${p.active===false?'Hidden':'Active'}</td><td><button class="btn light small" onclick="productForm('${p.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div></div>`}
function productForm(id){let p=products.find(x=>x.id===id)||{id:'KG-'+Date.now(),bn:'',en:'',price:0,base:0,disc:0,stock:0,active:true};$('#modalTitle').textContent=id?'Edit product':'Add product';$('#modalBody').innerHTML=`<form onsubmit="saveProduct(event,'${id||''}')"><div class="formgrid"><div class="field"><label>Product ID</label><input id="pid" value="${esc(p.id)}" ${id?'readonly':''}></div><div class="field"><label>Bangla name</label><input id="pbn" required value="${esc(p.bn||'')}"></div><div class="field"><label>English name</label><input id="pen" value="${esc(p.en||'')}"></div><div class="field"><label>Price (BDT)</label><input id="pprice" type="number" min="0" required value="${p.price??p.base??0}"></div><div class="field"><label>Discount (%)</label><input id="pdisc" type="number" min="0" max="90" value="${p.disc||0}"></div><div class="field"><label>Stock quantity</label><input id="pstock" type="number" min="0" value="${p.stock||0}"></div></div><p style="margin:14px 0"><label><input id="pactive" type="checkbox" ${p.active!==false?'checked':''}> Product active</label></p><button class="btn">Save product</button></form>`;$('#modal').classList.add('show')}
function saveProduct(e,id){e.preventDefault();let p={id:$('#pid').value,bn:$('#pbn').value,en:$('#pen').value,price:Number($('#pprice').value),base:Number($('#pprice').value),disc:Number($('#pdisc').value),stock:Number($('#pstock').value),active:$('#pactive').checked};if(id)products=products.map(x=>x.id===id?{...x,...p}:x);else products.push(p);set('kg_products',products);closeModal();render()}
function customersPage(){let rows=customers;if(!rows.length)rows=Array.from(new Map(orders.map(o=>[o.phone,{name:o.customer,phone:o.phone,district:o.district,totalOrders:orders.filter(x=>x.phone===o.phone).length,totalSpent:orders.filter(x=>x.phone===o.phone&&x.status!=='Cancelled').reduce((a,x)=>a+Number(x.total||0),0)}])).values());$('#content').innerHTML=`<div class="panel"><div class="panelhead"><h2>Customers (${rows.length})</h2></div><div class="tablewrap"><table><thead><tr><th>Name</th><th>Phone</th><th>District</th><th>Orders</th><th>Total spent</th><th>Contact</th></tr></thead><tbody>${rows.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td>${esc(c.district)}</td><td>${c.totalOrders||0}</td><td>${money(c.totalSpent)}</td><td><a class="btn light small" target="_blank" href="https://wa.me/88${String(c.phone).replace(/\\D/g,'').replace(/^88/,'')}">WhatsApp</a></td></tr>`).join('')}</tbody></table></div></div>`}
function inventoryPage(){$('#content').innerHTML=`<div class="panel"><div class="panelhead"><h2>Inventory Overview</h2><span>${products.filter(p=>Number(p.stock)<=5).length} low / out of stock</span></div><div class="tablewrap"><table><thead><tr><th>Product</th><th>Available stock</th><th>Stock status</th><th>Action</th></tr></thead><tbody>${products.map(p=>`<tr><td>${esc(p.bn||p.en)}</td><td>${p.stock}</td><td class="${p.stock==0?'out':p.stock<=5?'low':''}">${p.stock==0?'Out of stock':p.stock<=5?'Low stock':'In stock'}</td><td><button class="btn light small" onclick="productForm('${p.id}')">Update stock</button></td></tr>`).join('')}</tbody></table></div></div>`}
function reportsPage(){let total=orders.filter(o=>o.status!=='Cancelled').reduce((a,o)=>a+Number(o.total||0),0),avg=orders.length?total/orders.filter(o=>o.status!=='Cancelled').length:0;$('#content').innerHTML=`<div class="cards">${stat('Gross revenue',money(total),'৳','Excludes cancelled orders')}${stat('Completed + active orders',orders.filter(o=>o.status!=='Cancelled').length,'▤','Non-cancelled')}${stat('Average order value',money(avg),'↗','Based on non-cancelled orders')}${stat('Products',products.length,'◇','Catalog items')}</div><div class="panel"><div class="panelhead"><h2>Best selling products</h2></div>${(()=>{let m={};orders.filter(o=>o.status!=='Cancelled').forEach(o=>(o.items||[]).forEach(i=>m[i.productId||i.nameBn]=(m[i.productId||i.nameBn]||0)+Number(i.quantity||0)));let a=Object.entries(m).sort((x,y)=>y[1]-x[1]);return a.length?'<ol>'+a.map(x=>`<li style="padding:7px">${esc(x[0])} — ${x[1]} units</li>`).join('')+'</ol>':'<div class="empty">Sales data will appear after orders.</div>'})()}</div>`}
function settingsPage(){let s=get('kg_settings',{dhaka:60,outside:120,freeOver:3000,giftFee:50,wa:'8801924899441',lowStock:5});$('#content').innerHTML=`<div class="panel"><div class="panelhead"><h2>Store Settings</h2></div><form onsubmit="saveSettings(event)"><div class="formgrid">${setting('Inside Dhaka delivery','dhaka',s.dhaka)}${setting('Outside Dhaka delivery','outside',s.outside)}${setting('Free delivery threshold','freeOver',s.freeOver)}${setting('Gift packaging fee','giftFee',s.giftFee)}${setting('WhatsApp number','wa',s.wa,'text')}${setting('Low stock threshold','lowStock',s.lowStock)}</div><p style="margin-top:18px"><button class="btn">Save settings</button></p></form><p class="sub" style="margin-top:14px">These settings are saved for future integration. Review your store checkout configuration before using them in production.</p></div><div class="panel"><h2>Demo data</h2><p class="sub">Clear locally stored demo orders, customers and product overrides.</p><button class="btn danger" onclick="resetDemo()">Reset demo data</button></div>`}
function setting(label,key,value,type='number'){return `<div class="field"><label>${label}</label><input name="${key}" type="${type}" value="${esc(value)}" required></div>`}
function saveSettings(e){e.preventDefault();let f=new FormData(e.target),s={};for(let [k,v] of f.entries())s[k]=k==='wa'?v:Number(v);set('kg_settings',s);alert('Settings saved in this browser.')}
function resetDemo(){if(!confirm('This will clear demo orders, customers and product changes. Continue?'))return;['kg_orders','kg_customers','kg_products','kg_settings','kg_inventory'].forEach(k=>localStorage.removeItem(k));sync();render()}
function exportCSV(){sync();let rows=[['Order ID','Customer','Phone','Date','Total','Status'],...orders.map(o=>[o.id,o.customer,o.phone,o.createdAt,o.total,o.status])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='khejurghor-orders.csv';a.click();URL.revokeObjectURL(a.href)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function closeModal(){$('#modal').classList.remove('show')}
render();
</script></body></html>
